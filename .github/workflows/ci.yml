name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Lint, Security Scan & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System OpenCV Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff bandit

      - name: Run Code Style & Linter (Ruff)
        run: |
          ruff check . --exit-zero

      - name: Run Static Security Scanner (Bandit)
        run: |
          bandit -r app/ -ll --exit-zero

      - name: Run Automated Test Suite (Pytest)
        run: |
          pytest -v --cov=app --cov-report=term-missing
