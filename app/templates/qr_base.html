<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Student Mobile Attendance &bull; VisionAttend{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --primary-600: #4f46e5;
            --primary-700: #4338ca;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: #0f172a;
            background-image: radial-gradient(at 50% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 60%);
            color: var(--slate-800);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.25rem;
            -webkit-font-smoothing: antialiased;
        }

        .mobile-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: var(--radius-xl);
            padding: 2rem 1.5rem;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .mobile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
        }

        h2 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--slate-900);
            letter-spacing: -0.02em;
            margin-top: 0.5rem;
        }

        p {
            font-size: 0.85rem;
            color: var(--slate-500);
            line-height: 1.5;
        }

        .input-mobile {
            width: 100%;
            padding: 0.85rem 1rem;
            margin-top: 1rem;
            font-family: var(--font-mono);
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
            color: var(--slate-900);
            background: var(--slate-50);
            border: 1.5px solid var(--slate-300);
            border-radius: var(--radius-md);
            outline: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }

        .input-mobile:focus {
            background: #ffffff;
            border-color: var(--primary-600);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn-mobile {
            width: 100%;
            margin-top: 1.25rem;
            padding: 0.85rem 1.25rem;
            background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.15s ease;
        }

        .btn-mobile:active {
            transform: scale(0.98);
        }

        .btn-mobile:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.3rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            background: #eef2ff;
            color: var(--primary-700);
            border: 1px solid #c7d2fe;
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.72rem;
            color: var(--slate-500);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
        }
    </style>
</head>
<body>

{% block content %}{% endblock %}

</body>
</html>
