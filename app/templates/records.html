{% extends "base.html" %}
{% block content %}

<div class="card large" style="max-width:800px;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
        <h2 style="margin:0;">📑 Attendance Records Log</h2>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a href="/export_records" style="background:#2563eb; color:#ffffff; padding:8px 16px; font-size:13px; font-weight:600; border-radius:6px; text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
                📥 Export CSV Report
            </a>
            <button onclick="clearRecords()" style="background:#dc2626; padding:8px 16px; font-size:13px; margin:0;">
                🗑 Clear All Records
            </button>
        </div>
    </div>

    <div style="overflow-x:auto;">
        <table id="table">
            <tr>
                <td colspan="3" style="color:#64748b; padding:20px;">Loading attendance logs...</td>
            </tr>
        </table>
    </div>
</div>

<script src="/static/js/records.js"></script>

{% endblock %}
