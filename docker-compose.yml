version: '3.8'

services:
  # 1. Flask Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/attendence_db
      - SECRET_KEY=production-secure-random-secret-key-xyz-987654321
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - attendance_net

  # 2. PostgreSQL with pgvector extension Service
  db:
    image: pgvector/pgvector:pg16
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendence_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendence_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - attendance_net

  # 3. Redis Distributed Cache & Lock Service
  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - attendance_net

  # 4. Prometheus Telemetry & Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: attendance_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - attendance_net

  # 5. Grafana Visualization & SLA Dashboard
  grafana:
    image: grafana/grafana:10.2.0
    container_name: attendance_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - attendance_net

networks:
  attendance_net:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
